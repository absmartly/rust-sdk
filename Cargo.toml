[package]
name = "absmartly-sdk"
version = "0.1.0"
edition = "2021"
authors = ["ABsmartly"]
description = "ABsmartly SDK for Rust - A/B testing and feature flagging"
license = "MIT"
repository = "https://github.com/absmartly/rust-sdk"
homepage = "https://www.absmartly.com"
documentation = "https://docs.rs/absmartly-sdk"
readme = "README.md"
keywords = ["absmartly", "ab-testing", "feature-flags", "experimentation", "sdk"]
categories = ["development-tools", "web-programming"]
exclude = [".github/", "target/", ".claude/"]
rust-version = "1.70"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_results = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

pedantic = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"

unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
wildcard_imports = "warn"
enum_glob_use = "warn"
rc_buffer = "warn"
str_to_string = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "1.0"
md-5 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
