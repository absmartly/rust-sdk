[package]
name = "absmartly-sdk"
version = "0.1.0"
edition = "2021"
authors = ["ABsmartly"]
description = "ABsmartly SDK for Rust"
license = "MIT"
repository = "https://github.com/absmartly/rust-sdk"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "1.0"
md-5 = "0.10"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
